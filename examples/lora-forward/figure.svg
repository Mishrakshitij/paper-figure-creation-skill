<svg xmlns="http://www.w3.org/2000/svg" width="7in" height="4.166666666666667in" viewBox="0 0 1008 600" role="img" aria-labelledby="title desc">
<title id="title">LoRA: low-rank adaptation and merged deployment</title><desc id="desc">The same input x passes through frozen W zero and through trainable A then B, scaled by alpha over r. Their outputs are summed. After training the scaled update can be merged into a single deployment matrix.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#182C3A"/></marker></defs>
<g font-family="DejaVu Sans, sans-serif">
<rect x="0" y="0" width="1008" height="600" rx="0" fill="white" stroke="none" stroke-width="1.8"/>
<g id="adaptation">
<text x="24" y="31" font-size="22" fill="#182C3A" font-weight="bold" text-anchor="start">a</text>
<text x="52" y="31" font-size="21" fill="#182C3A" font-weight="bold" text-anchor="start">Adaptation</text>
<text x="982" y="32" font-size="24" fill="#182C3A" font-weight="normal" text-anchor="end">h = W<tspan baseline-shift="sub" font-size="70%">0</tspan>x + (α/r)BAx</text>
<text x="328" y="69" font-size="17" fill="#526371" font-weight="bold" text-anchor="middle">FROZEN</text>
<text x="588" y="69" font-size="18" fill="#526371" font-weight="normal" text-anchor="start">Pretrained linear map</text>
<rect x="213" y="224" width="593" height="164" rx="12" fill="#FFF4E8" stroke="none" stroke-width="1.8"/>
<text x="229" y="249" font-size="17" fill="#AE5415" font-weight="bold" text-anchor="start">LOW-RANK UPDATE</text>
<text x="786" y="249" font-size="17" fill="#AE5415" font-weight="normal" text-anchor="end">A and B trainable</text>
<path d="M81,210 L146,210" fill="none" stroke="#182C3A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<circle cx="146" cy="210" r="3.5" fill="#182C3A" stroke="none" stroke-width="2"/>
<path d="M146,210 L146,133 L248,133" fill="none" stroke="#182C3A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M146,210 L146,292 L248,292" fill="none" stroke="#182C3A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M408,133 L875,133 L875,190" fill="none" stroke="#182C3A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M386,292 L445,292" fill="none" stroke="#182C3A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M470,292 L552,292" fill="none" stroke="#182C3A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M595,292 L713,292" fill="none" stroke="#182C3A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M777,292 L875,292 L875,231" fill="none" stroke="#182C3A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M895,210 L927,210" fill="none" stroke="#182C3A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="253" y="89" width="150" height="88" rx="0" fill="#EAF0F4" stroke="#607787" stroke-width="2"/>
<path d="M261,97 L261,169" fill="none" stroke="#607787" stroke-width="1" stroke-linejoin="round"/>
<path d="M395,97 L395,169" fill="none" stroke="#607787" stroke-width="1" stroke-linejoin="round"/>
<text x="328.0" y="141.0" font-size="26" fill="#182C3A" font-weight="normal" text-anchor="middle">W<tspan baseline-shift="sub" font-size="70%">0</tspan></text>
<text x="328" y="201" font-size="19" fill="#526371" font-weight="normal" text-anchor="middle">d × k</text>
<text x="621" y="119" font-size="20" fill="#182C3A" font-weight="normal" text-anchor="middle">W<tspan baseline-shift="sub" font-size="70%">0</tspan>x ∈ ℝ<tspan baseline-shift="super" font-size="70%">d</tspan></text>
<rect x="253" y="271" width="128" height="42" rx="0" fill="#FFE1BB" stroke="#AE5415" stroke-width="2"/>
<path d="M261,279 L261,305" fill="none" stroke="#AE5415" stroke-width="1" stroke-linejoin="round"/>
<path d="M373,279 L373,305" fill="none" stroke="#AE5415" stroke-width="1" stroke-linejoin="round"/>
<text x="317.0" y="300.0" font-size="26" fill="#182C3A" font-weight="normal" text-anchor="middle">A</text>
<text x="317" y="342" font-size="19" fill="#AE5415" font-weight="normal" text-anchor="middle">r × k</text>
<text x="317" y="368" font-size="17" fill="#AE5415" font-weight="normal" text-anchor="middle">Gaussian init.</text>
<rect x="450" y="281" width="16" height="22" rx="0" fill="#FFE1BB" stroke="#AE5415" stroke-width="1.8"/>
<text x="459" y="274" font-size="19" fill="#182C3A" font-weight="normal" text-anchor="middle">Ax</text>
<text x="459" y="337" font-size="19" fill="#182C3A" font-weight="normal" text-anchor="middle">ℝ<tspan baseline-shift="super" font-size="70%">r</tspan></text>
<rect x="557" y="257" width="38" height="70" rx="0" fill="#FFE1BB" stroke="#AE5415" stroke-width="2"/>
<path d="M565,265 L565,319" fill="none" stroke="#AE5415" stroke-width="1" stroke-linejoin="round"/>
<path d="M587,265 L587,319" fill="none" stroke="#AE5415" stroke-width="1" stroke-linejoin="round"/>
<text x="576.0" y="300.0" font-size="26" fill="#182C3A" font-weight="normal" text-anchor="middle">B</text>
<text x="576" y="350" font-size="19" fill="#AE5415" font-weight="normal" text-anchor="middle">d × r</text>
<text x="576" y="374" font-size="17" fill="#AE5415" font-weight="normal" text-anchor="middle">zero init.</text>
<text x="652" y="279" font-size="19" fill="#182C3A" font-weight="normal" text-anchor="middle">BAx</text>
<rect x="718" y="271" width="59" height="42" rx="5" fill="white" stroke="#AE5415" stroke-width="1.8"/>
<text x="747.5" y="299" font-size="21" fill="#182C3A" font-weight="normal" text-anchor="middle">α/r</text>
<text x="747.5" y="338" font-size="17" fill="#AE5415" font-weight="normal" text-anchor="middle">scale</text>
<text x="56" y="212" font-size="29" fill="#182C3A" font-weight="normal" text-anchor="middle" font-style="italic">x</text>
<text x="56" y="241" font-size="19" fill="#526371" font-weight="normal" text-anchor="middle">ℝ<tspan baseline-shift="super" font-size="70%">k</tspan></text>
<text x="56" y="272" font-size="17" fill="#526371" font-weight="normal" text-anchor="middle">input</text>
<circle cx="875" cy="210" r="19" fill="white" stroke="#182C3A" stroke-width="2"/>
<text x="875" y="219" font-size="30" fill="#182C3A" font-weight="normal" text-anchor="middle">+</text>
<text x="842" y="216" font-size="17" fill="#526371" font-weight="normal" text-anchor="end">sum</text>
<text x="951" y="212" font-size="29" fill="#182C3A" font-weight="normal" text-anchor="middle" font-style="italic">h</text>
<text x="951" y="241" font-size="19" fill="#526371" font-weight="normal" text-anchor="middle">ℝ<tspan baseline-shift="super" font-size="70%">d</tspan></text>
<text x="951" y="272" font-size="17" fill="#526371" font-weight="normal" text-anchor="middle">output</text>
<text x="229" y="414" font-size="19" fill="#AE5415" font-weight="normal" text-anchor="start">r ≪ min(d, k)</text>
<text x="472" y="414" font-size="18" fill="#182C3A" font-weight="normal" text-anchor="start">At initialization: BA = 0, so h = W<tspan baseline-shift="sub" font-size="70%">0</tspan>x</text>
</g>
<path d="M24,438 L984,438" fill="none" stroke="#CFD8DE" stroke-width="1.4" stroke-linejoin="round"/>
<g id="deployment">
<text x="24" y="470" font-size="22" fill="#182C3A" font-weight="bold" text-anchor="start">b</text>
<text x="52" y="470" font-size="21" fill="#182C3A" font-weight="bold" text-anchor="start">Deployment</text>
<text x="238" y="470" font-size="18" fill="#526371" font-weight="normal" text-anchor="start">Merge once after training</text>
<text x="52" y="520" font-size="25" fill="#182C3A" font-weight="normal" text-anchor="start">W<tspan baseline-shift="sub" font-size="70%">merged</tspan> = W<tspan baseline-shift="sub" font-size="70%">0</tspan> + (α/r)BA</text>
<text x="52" y="556" font-size="19" fill="#526371" font-weight="normal" text-anchor="start">W<tspan baseline-shift="sub" font-size="70%">merged</tspan> ∈ ℝ<tspan baseline-shift="super" font-size="70%">d × k</tspan></text>
<text x="639" y="522" font-size="26" fill="#182C3A" font-weight="normal" text-anchor="middle" font-style="italic">x</text>
<path d="M657,513 L707,513" fill="none" stroke="#182C3A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="713" y="480" width="140" height="66" rx="0" fill="#EAF0F4" stroke="#607787" stroke-width="2"/>
<path d="M721,488 L721,538" fill="none" stroke="#607787" stroke-width="1" stroke-linejoin="round"/>
<path d="M845,488 L845,538" fill="none" stroke="#607787" stroke-width="1" stroke-linejoin="round"/>
<text x="783.0" y="521.0" font-size="26" fill="#182C3A" font-weight="normal" text-anchor="middle">W<tspan baseline-shift="sub" font-size="70%">merged</tspan></text>
<path d="M858,513 L913,513" fill="none" stroke="#182C3A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="937" y="522" font-size="26" fill="#182C3A" font-weight="normal" text-anchor="middle" font-style="italic">h</text>
<text x="783" y="575" font-size="18" fill="#526371" font-weight="normal" text-anchor="middle">One linear map: h = W<tspan baseline-shift="sub" font-size="70%">merged</tspan>x</text>
</g></g></svg>