<text x="42" y="123" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#176c67" text-anchor="start">leg_counting</text>
<text x="42" y="155" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#243239" text-anchor="start">10 entries  ·  seed 42</text>
<line x1="245" y1="114" x2="245" y2="162" stroke="#c1ccce" stroke-width="1.5" />
<text x="254" y="123" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#243239" text-anchor="start">Procedural generator</text>
<text x="264" y="153" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#4f6267" text-anchor="start">Configurable complexity</text>
<path d="M249 180 V205" fill="none" stroke="#243239" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
</g>
<text x="548" y="140" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#4f6267" text-anchor="start">Static question–answer interface</text>
