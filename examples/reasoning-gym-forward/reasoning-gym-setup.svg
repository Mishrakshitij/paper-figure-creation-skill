<svg xmlns="http://www.w3.org/2000/svg" width="7in" height="4.125in" viewBox="0 0 1008 594" role="img" aria-labelledby="title desc">
<title id="title">Reasoning Gym benchmark setup</title><desc id="desc">Procedural leg-counting generation with size 10 and seed 42 produces an entry containing a question about one sea slug and one deer. The model receives only question text and produces an illustrative answer 4. A task-specific verifier receives the answer and the complete entry including reference answer and metadata. A reference answer check is documented to score 1.0. No aggregate model performance is shown.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#243239"/></marker></defs>
<rect x="0" y="0" width="1008" height="594" rx="0" fill="white" stroke="none" stroke-width="1.5"/>
<text x="24" y="31" font-family="DejaVu Sans" font-size="23" font-weight="bold" fill="#243239" text-anchor="start">Reasoning Gym: generate a question, verify an answer</text>
<text x="24" y="75" font-family="DejaVu Sans" font-size="21" font-weight="bold" fill="#243239" text-anchor="start">a</text>
<text x="48" y="75" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#243239" text-anchor="start">Construct one example</text>
<text x="548" y="75" font-family="DejaVu Sans" font-size="21" font-weight="bold" fill="#243239" text-anchor="start">b</text>
<text x="572" y="75" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#243239" text-anchor="start">Answer and verify</text>
<g id="procedural-construction">
